<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sarah Learning</title><style>*{box-sizing:border-box}body{margin:0;background:#10182c;color:#fff;font:18px system-ui}main{max-width:560px;margin:auto;padding:30px 22px;text-align:center}small{color:#b4c8ee} .orb{margin:25px auto;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#d9ffff,#59a6e9 35%,#7451c9 70%,#18284d);box-shadow:0 0 40px #597bdb88}section{background:#202d48;border-radius:25px;padding:24px;margin:20px 0}button,input,select{font:inherit;border:0;border-radius:14px;padding:15px;margin:6px 0;width:100%}button{background:#a8e5ff;color:#102039;font-weight:700}button.secondary{background:#354663;color:white}input,select{background:#fff;color:#17233b}h1{font-size:28px}h2{font-size:36px;margin:10px}#status{min-height:48px}progress{width:100%}</style><main><small>SARAH • POLISH TEACHER</small><div class="orb"></div><h1>Let's learn together!</h1><p id="status" role="status">Tap Start to meet Sarah.</p><button id="start">Start lesson</button><section><small id="count"></small><h2 id="word"></h2><p id="hint"></p><button id="hear">Hear the Polish word</button><button id="mic">🎙 Speak to Sarah</button><select id="lang" aria-label="Speaking language"><option value="pl-PL">I'm speaking Polish</option><option value="en-GB">I'm speaking English</option></select><input id="answer" placeholder="Or type your answer" autocomplete="off"><button id="check">Send answer</button><button class="secondary" id="next">Next word</button><button class="secondary" id="stop">Stop speaking / listening</button></section><p id="score"></p><small>Practice prototype • Progress stays on this device. Browser speech recognition may send audio to its provider. Use with a parent.</small></main><script>
const words=[['apple','jabłko','🍎'],['milk','mleko','🥛'],['bread','chleb','🍞'],['dog','pies','🐶'],['cat','kot','🐱'],['hello','cześć','👋'],['thank you','dziękuję','⭐'],['water','woda','💧'],['school','szkoła','📚'],['good morning','dzień dobry','☀️']];
const $=id=>document.getElementById(id);let i=0,rec=null,done=false,stats={};try{stats=JSON.parse(localStorage.getItem('sarah-progress')||'{}')}catch{};const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z ]/g,'').trim();
function speak(parts){speechSynthesis.cancel();for(const [text,lang] of parts){const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;const v=speechSynthesis.getVoices().find(v=>v.lang===lang);if(v)u.voice=v;speechSynthesis.speak(u)}}
function show(){done=false;$('word').textContent=words[i][2]+' '+words[i][0];$('count').textContent='Word '+(i+1)+' of '+words.length;$('hint').textContent='How do you say this in Polish?';$('score').textContent='⭐ Words practiced successfully: '+Object.values(stats).filter(x=>x.ok).length;$('answer').value=''}
function ask(){show();$('status').textContent='How do you say '+words[i][0]+' in Polish?';speak([[$('status').textContent,'en-GB']])}
function teach(){ $('hint').textContent=words[i][1];speak([['In Polish we say','en-GB'],[words[i][1],'pl-PL'],['Your turn!','en-GB']])}
function submit(t){if(!t.trim())return;const n=norm(t);let w=words[i];if(n===norm(w[1])){if(!done){stats[w[0]]={ok:true};done=true;try{localStorage.setItem('sarah-progress',JSON.stringify(stats))}catch{}}$('score').textContent='⭐ Words practiced successfully: '+Object.values(stats).filter(x=>x.ok).length;$('status').textContent='Brilliant! Well done! Tap Next when ready.';speak([['Brilliant! Well done!','en-GB']]);return}if(/how (do|can) (you|i) say|what is .* in polish/.test(n)){const match=words.find(x=>n.includes(norm(x[0])));if(match){$('status').textContent=match[0]+' = '+match[1];speak([['In Polish we say','en-GB'],[match[1],'pl-PL'],['Now back to our word.','en-GB']]);return}}$('status').textContent='Good try! Let’s practice together.';teach()}
$('start').onclick=ask;$('hear').onclick=teach;$('check').onclick=()=>submit($('answer').value);$('next').onclick=()=>{i=(i+1)%words.length;ask()};$('stop').onclick=()=>{speechSynthesis.cancel();if(rec)rec.abort();$('status').textContent='Paused.'};$('mic').onclick=()=>{speechSynthesis.cancel();const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='Speech recognition unavailable. You can type instead.';return}if(rec)return;rec=new R();rec.lang=$('lang').value;rec.onresult=e=>{const t=e.results[0][0].transcript;$('answer').value=t;submit(t)};rec.onerror=e=>{$('status').textContent='Could not hear you. Try again or type.'};rec.onend=()=>{rec=null};try{rec.start();$('status').textContent='Listening…'}catch{rec=null;$('status').textContent='Microphone unavailable.'}};show();
</script></html>
