<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarah Learning V2</title><style> *{box-sizing:border-box}body{margin:0;background:#10182c;color:white;font:18px system-ui}main{max-width:480px;margin:auto;padding:35px 24px;text-align:center}small{color:#b4c8ee}.orb{margin:30px auto;width:145px;height:145px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#d9ffff,#59a6e9 35%,#7451c9 70%,#18284d);box-shadow:0 0 40px #597bdb88}button{font:inherit;border:0;border-radius:16px;padding:16px;width:100%;background:#a8e5ff;color:#102039;font-weight:bold;margin:8px 0}#end{background:#354663;color:white}#picture{font-size:70px;margin:12px}#status{min-height:30px;color:#a8e5ff}#message{min-height:80px} [hidden]{display:none!important}</style><main><small>SARAH • LEARNING V2</small><div class="orb"></div><div id="status" role="status">Ready to learn</div><h1 id="picture">👋</h1><h2 id="word">Let's learn Polish!</h2><p id="message">Sarah will guide you.</p><button id="start">Start lesson</button><button id="retry" hidden>Resume listening</button><button id="end" hidden>End lesson</button><p id="score"></p><small>Browser voice prototype. Use with a parent. Speech recognition may send audio to its provider. No recordings stored by this app.</small></main><script>
const words=[['apple','jabłko','🍎'],['milk','mleko','🥛'],['bread','chleb','🍞'],['dog','pies','🐶'],['cat','kot','🐱'],['hello','cześć','👋'],['thank you','dziękuję','⭐'],['water','woda','💧'],['school','szkoła','📚'],['good morning','dzień dobry','☀️']];
const $=id=>document.getElementById(id),R=window.SpeechRecognition||window.webkitSpeechRecognition;let active=false,epoch=0,rec=null,i=0,score=0,attempt=0,miss=0,lang='en-GB';const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z ]/g,' ').replace(/ +/g,' ').trim();
function stopRec(){if(rec){let r=rec;rec=null;r.onend=r.onerror=r.onresult=null;try{r.abort()}catch{}}}
function pause(msg){$('status').textContent=msg;$('retry').hidden=false}
function listen(token){if(!active||token!==epoch)return;stopRec();if(!R){pause('Speech recognition is unavailable in this browser.');return}let r=new R();rec=r;r.lang=lang;r.interimResults=false;r.maxAlternatives=5;let heard=false,failed=false;r.onresult=e=>{if(rec!==r||token!==epoch)return;heard=true;let a=Array.from(e.results[0],x=>x.transcript);stopRec();respond(a)};r.onerror=e=>{if(rec!==r)return;failed=true;rec=null;if(e.error==='no-speech'&&miss++<2){lang=lang==='en-GB'?'pl-PL':'en-GB';setTimeout(()=>listen(token),350)}else pause('Listening paused. Tap to resume.')};r.onend=()=>{if(rec!==r)return;rec=null;if(!heard&&!failed){if(miss++<2){lang=lang==='en-GB'?'pl-PL':'en-GB';setTimeout(()=>listen(token),350)}else pause('Tap to resume listening.')}};try{r.start();$('status').textContent='Listening…';$('retry').hidden=true}catch{rec=null;pause('Tap to allow listening.')}} 
function speak(parts,nextLang='pl-PL',after){stopRec();let token=++epoch;miss=0;lang=nextLang;speechSynthesis.cancel();$('status').textContent='Sarah is speaking…';$('message').textContent=parts.map(p=>p[0]).join(' ');let j=0;function next(){if(!active||token!==epoch)return;if(j===parts.length){if(after)after();else listen(token);return}let [t,l]=parts[j++],u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.85;let v=speechSynthesis.getVoices().find(v=>v.lang===l);if(v)u.voice=v;u.onend=next;u.onerror=()=>{if(active&&token===epoch)pause('Voice playback paused. Tap to resume.')};speechSynthesis.speak(u)}next()}
const en=t=>[t,'en-GB'],pl=t=>[t,'pl-PL'];
function ask(){attempt=0;let w=words[i];$('picture').textContent=w[2];$('word').textContent=w[0];speak([en('How do you say '+w[0]+' in Polish?')],'en-GB')}
function teach(prefix){let w=words[i];$('word').textContent=w[1];speak([en(prefix+' In Polish we say'),pl(w[1]),en('Your turn. Try saying it.')],'pl-PL')}
function respond(alts){let w=words[i],a=alts.map(norm),n=a[0];if(a.some(x=>x===norm(w[1]))){score++;$('score').textContent='⭐ '+score+' words practiced';speak([en('Well done! Brilliant effort!')],'en-GB',()=>{if(++i<words.length)ask();else{active=false;$('status').textContent='Lesson complete!';$('start').hidden=false;$('end').hidden=true}});return}if(/how (do|can) (you|i) say|what is .* in polish/.test(n)){let q=words.find(x=>n.includes(norm(x[0])));if(q){speak([en('Great question! In Polish we say'),pl(q[1]),en('Now back to our word. How do you say '+w[0]+'?')],'pl-PL');return}}if(/dont know|don t know|no idea|nie wiem|help/.test(n)){teach('That is okay!');return}attempt++;teach(attempt>1?'Keep trying, you are doing well.':'Good effort!')}
$('start').onclick=()=>{active=true;i=score=0;$('score').textContent='';$('start').hidden=true;$('end').hidden=false;ask()};$('retry').onclick=()=>{if(active){miss=0;listen(++epoch)}};$('end').onclick=()=>{active=false;++epoch;stopRec();speechSynthesis.cancel();$('start').hidden=false;$('end').hidden=true;$('retry').hidden=true;$('status').textContent='Lesson ended';};</script></html>
